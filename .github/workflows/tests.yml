name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # requerido por SonarCloud para el análisis completo

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: python -m pip install --only-binary :all: --require-hashes -r requirements.txt

      - name: Ejecutar pruebas (incluye prueba de contrato)
        run: PYTHONPATH=. pytest -q --junitxml=pytest-report.xml

      - name: Análisis SonarCloud
        if: ${{ env.SONAR_TOKEN != '' || secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
