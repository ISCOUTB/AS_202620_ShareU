name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Se expone como variable de entorno para poder condicionar el paso:
      # el contexto `secrets` no es fiable dentro de un `if`.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # requerido por SonarCloud para el análisis completo

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: "python -m pip install --only-binary=:all: --require-hashes -r requirements.txt"

      - name: Ejecutar pruebas (incluye prueba de contrato)
        run: PYTHONPATH=. pytest -q --junitxml=pytest-report.xml

      - name: Validar documentación (rutas, enlaces, ADR y aspectos)
        run: python scripts/validar_docs.py --verbose

      - name: Publicar reporte JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: warn

      - name: Análisis SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@383f7e52eae3ab0510c3cb0e7d9d150bbaeab838 # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Auditar dependencias Python (pip-audit)
        run: |
          python -m pip install --only-binary=:all: pip-audit==2.9.0
          python -m pip_audit -r requirements.in --progress-spinner off

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Se ejecuta y se publica el resultado; un hallazgo alto se revisa y se
      # decide en docs/seguridad/dependencias.md, no se oculta ni se ignora.
      - name: Auditar dependencias JavaScript (npm audit)
        working-directory: app/frontend
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --audit-level=high

      - name: Publicar resultado de npm audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: app/frontend/npm-audit.json
          if-no-files-found: warn

  medicion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: "python -m pip install --only-binary=:all: --require-hashes -r requirements.txt"

      - name: Medir latencia y lecturas de la búsqueda
        run: |
          python -m scripts.medicion.bench_busqueda \
            --peticiones 100 --repeticiones 3 --concurrencia 10 \
            --json-out docs/evidencia/mediciones/ci-s14.json \
            --md-out docs/evidencia/mediciones/ci-s14.md \
            --etiqueta ci-s14

      - name: Publicar artefactos de medición
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medicion-s14
          path: docs/evidencia/mediciones/ci-s14.*
          if-no-files-found: warn
